# LingHua cache rules for nginx. Installed by deploy.sh / update.sh as
# /etc/nginx/snippets/linghua-cache.conf and included in the site's server block.
# Edit this file in the repo, not on the server: update.sh copies it on every run.

# The page itself and the service worker files: always ask the server first,
# so a new release reaches everyone on their next visit.
location = /index.html {
    add_header Cache-Control "no-cache";
}
location = /manifest.webmanifest {
    add_header Cache-Control "no-cache";
}
location ~ ^/(sw|registerSW|hua-sw)\.js$ {
    add_header Cache-Control "no-cache";
}

# Built JS/CSS have a content hash in their names, so they never change: cache for a year.
location ^~ /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# Other static files (icons, images, fonts) keep their names between releases,
# so cache them for a week but let the browser check after that.
location ~* \.(png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|mp3|js|css)$ {
    add_header Cache-Control "public, max-age=604800";
}
