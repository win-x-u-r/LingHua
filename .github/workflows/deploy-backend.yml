# Copies the backend to a Hugging Face Space whenever backend code changes
# on master. The Space builds backend/Dockerfile and restarts by itself.
#
# One-time setup (see DEPLOYING.md):
#   - Repo secret   HF_TOKEN  = a Hugging Face access token with "write" access
#   - Repo variable HF_SPACE  = the Space name, e.g. your-name/linghua-backend
# Until both are set this workflow does nothing.
name: Deploy backend

on:
  push:
    branches: [master]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE: ${{ vars.HF_SPACE }}
    steps:
      - name: Check setup
        id: check
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE" ]; then
            echo "HF_TOKEN or HF_SPACE not set, skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.skip != 'true'

      - name: Prepare Space files
        if: steps.check.outputs.skip != 'true'
        run: |
          mkdir -p space
          cp -r backend/. space/
          rm -rf space/tests space/.env space/__pycache__
          # The Space reads its settings from the top of README.md
          cat > space/README.md <<'MD'
          ---
          title: LingHua Backend
          sdk: docker
          app_port: 7860
          pinned: false
          ---

          API for LingHua. Built automatically from the GitHub repo.
          MD

      - name: Upload to Hugging Face
        if: steps.check.outputs.skip != 'true'
        run: |
          pip install --quiet "huggingface_hub>=0.25"
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          HfApi(token=os.environ["HF_TOKEN"]).upload_folder(
              repo_id=os.environ["HF_SPACE"],
              repo_type="space",
              folder_path="space",
              commit_message=f"Deploy {os.environ['GITHUB_SHA'][:7]}",
              delete_patterns=["*"],
          )
          PY
